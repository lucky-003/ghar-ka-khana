name: Rename file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename ghar-ka-khana.html to index.html
        run: |
          git config user.name "lucky-003"
          git config user.email "lucky-003@users.noreply.github.com"
          git mv ghar-ka-khana.html index.html
          git commit -m "Rename ghar-ka-khana.html to index.html"
          git push
